[build]
  publish = "."

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Récap Discord : le rendu PNG a besoin du moteur resvg en WebAssembly et des
# polices Inter (OFL), embarqués seulement dans les deux fonctions concernées.
# Le .wasm doit être listé À LA MAIN dans included_files : external_node_modules
# n'embarque que les fichiers JS trouvés en suivant les imports, et rien
# n'importe le .wasm (on le lit comme un fichier). Sans cette ligne, la
# fonction répondait « moteur de rendu introuvable » en production.
[functions."discord-recap"]
  external_node_modules = ["@resvg/resvg-wasm"]
  included_files = ["netlify/functions/assets/**", "node_modules/@resvg/resvg-wasm/index_bg.wasm"]
[functions."discord-recap-preview"]
  external_node_modules = ["@resvg/resvg-wasm"]
  included_files = ["netlify/functions/assets/**", "node_modules/@resvg/resvg-wasm/index_bg.wasm"]

# Toujours revalider les fichiers clés pour qu'un nouveau déploiement arrive
# tout de suite dans le navigateur (évite un app.js mis en cache trop longtemps).
[[headers]]
  for = "/app.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/roster.json"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

# Vérification Riot. Le portail affiche l'URL du fichier avec une DOUBLE barre
# (il colle l'URL du produit, qui finit déjà par « / », avec « /riot.txt »).
# Par défaut Netlify répond une redirection sur ce chemin ; si leur robot de
# vérification ne suit pas les redirections, la vérification échouerait pour
# une raison qui n'a rien à voir avec le fichier. On sert donc le fichier
# DIRECTEMENT (status 200, pas 301) sur le chemin à double barre aussi.
[[redirects]]
  from = "//riot.txt"
  to = "/riot.txt"
  status = 200

# Et on ne laisse rien mettre ce fichier en cache : si une 404 a été servie
# avant que le fichier existe, elle ne doit pas survivre au déploiement.
[[headers]]
  for = "/riot.txt"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    content-type = "text/plain; charset=utf-8"

# Fonction planifiée : le cron est déclaré en inline dans
# netlify/functions/refresh-matches.mjs (export const config = { schedule }).
# Il tourne tous les jours à 04:00 UTC pour faire grossir l'historique stocké.
# Netlify Blobs (store "cosmo-history") est activé automatiquement sur un site
# Netlify standard, aucune config supplémentaire n'est requise ici.
